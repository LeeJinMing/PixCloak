name: Paid workflow setup — scope request
description: Ask for a quote for a local image workflow. No order or payment is created.
title: "[Workflow inquiry] "
body:
  - type: markdown
    attributes:
      value: |
        Describe a local image-preparation workflow. This is a public inquiry, not an order. We will agree scope, price, delivery date and payment method separately before work starts. Starting quotes: US$49 for one preset; US$149 for up to three presets and one filename rule.

        Do not include private images, customer information, passwords or payment details. A public spec or fictional example is sufficient. For an ordinary bug, use a bug report instead.
  - type: dropdown
    id: package
    attributes:
      label: Setup option
      options:
        - One workflow — starting quote US$49
        - Team workflow — starting quote US$149
        - Unsure — please assess the scope
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Output requirements
      description: Format, maximum KB, pixel limits, and number of presets. Use 1 KB = 1024 bytes unless your destination states otherwise.
      placeholder: JPEG, at most 200 KB, longest side at most 1600 px. About 20 files per batch.
    validations:
      required: true
  - type: textarea
    id: filenames
    attributes:
      label: Filename rule and example
      description: Use a made-up example. Do not post actual customer identifiers.
      placeholder: catalog-0001.jpg, catalog-0002.jpg
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser, operating system and desired delivery date
      placeholder: Chrome on Windows 11; desired delivery next week.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Optional public specification or questions
      description: Public URLs or non-sensitive examples only.
